name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No external modules, so there is no go.sum for the action to key its
      # cache on. Caching off keeps the run free of restore warnings.
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: false

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -race ./...

      - name: build
        run: go build -trimpath -ldflags='-s -w' -o offpeak-router .
